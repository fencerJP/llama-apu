name: Release (AMD Ryzen AI APU)

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: Build and Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libdrm-dev ninja-build
      - name: Build Release Bundle
        run: |
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh ${{ github.ref_name }}
      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
