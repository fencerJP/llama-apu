[package]
name = "zero-copy-model-runner"
version = "0.5.1"
edition = "2021"
authors = ["Heterogeneous APU Orchestrator Contributors"]
description = "Production-grade user-space heterogeneous LLM inference runtime orchestrator for AMD APUs"
license = "Apache-2.0"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9.11"
nix = { version = "0.29", features = ["fs", "ioctl", "mman", "sched"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1"

[lib]
name = "zero_copy_model_runner"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "apu-doctor"
path = "src/bin/apu_doctor.rs"

[[bin]]
name = "apu-model"
path = "src/bin/apu_model.rs"

[[bin]]
name = "apu-synth"
path = "src/bin/apu_synth.rs"

[[bin]]
name = "llama-convert"
path = "src/bin/llama_convert.rs"



